<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FreshMart - Create Account</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="images/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <!-- Dark Mode & RTL Controls -->
    <div class="auth-controls">
        <button class="theme-toggle" id="theme-toggle">
            <i class="fa-solid fa-moon"></i>
        </button>

        <button class="rtl-toggle" id="rtl-toggle">
            <i class="fa-solid fa-right-left"></i>
        </button>
    </div>
<!-- Register Section -->
<section class="registerform-section">

    <div class="registerform-card">

        <!-- Logo -->
        <div class="registerform-logo">
            <a href="index.html" class="logo-link">
                <img src="images/logo.png" alt="FreshMart Logo">
                
            </a>
        </div>

        <!-- Header -->
        <div class="registerform-header">
            <span class="registerform-tag">Join FreshMart</span>
            <h1>Create Your Account</h1>
            <p>
                Create your FreshMart account to shop faster, track orders,
                earn reward points, and receive exclusive grocery offers.
            </p>
        </div>

        <!-- Register Form -->
        <form class="registerform-form">

            <div class="registerform-group">
                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    placeholder="Enter your full name"
                    required>
            </div>

            <div class="registerform-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email address"
                    required>
            </div>

            <div class="registerform-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    placeholder="Enter your phone number"
                    required>
            </div>

            <!-- Password -->
            <div class="registerform-group">
                <label for="password">Password</label>

                <div class="registerform-password">

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        required>

                    <button
                        type="button"
                        class="registerform-eye"
                        aria-label="Show password">

                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M1 12C2.8 7.5 6.9 4.5 12 4.5C17.1 4.5 21.2 7.5 23 12C21.2 16.5 17.1 19.5 12 19.5C6.9 19.5 2.8 16.5 1 12Z"
                                  stroke="currentColor"
                                  stroke-width="2"/>
                            <circle cx="12" cy="12" r="3"
                                    stroke="currentColor"
                                    stroke-width="2"/>
                        </svg>

                    </button>

                </div>

            </div>

            <!-- Confirm Password -->
            <div class="registerform-group">
                <label for="confirm-password">Confirm Password</label>

                <div class="registerform-password">

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your password"
                        required>

                    <button
                        type="button"
                        class="registerform-eye"
                        aria-label="Show password">

                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                            <path d="M1 12C2.8 7.5 6.9 4.5 12 4.5C17.1 4.5 21.2 7.5 23 12C21.2 16.5 17.1 19.5 12 19.5C6.9 19.5 2.8 16.5 1 12Z"
                                  stroke="currentColor"
                                  stroke-width="2"/>
                            <circle cx="12" cy="12" r="3"
                                    stroke="currentColor"
                                    stroke-width="2"/>
                        </svg>

                    </button>

                </div>

            </div>

            <!-- Terms -->
            <label class="registerform-terms">
                <input type="checkbox" required>
                <span>
                    I agree to the
                    <a href="#">Terms & Conditions</a>
                    and
                    <a href="#">Privacy Policy</a>
                </span>
            </label>

            <!-- Create Account Button -->
            <button type="submit" class="registerform-btn">
                Create Account
            </button>

        </form>

        <!-- Divider -->
        <div class="registerform-divider">
            <span>or continue with</span>
        </div>

        <!-- Social Login -->
        <div class="registerform-social">

            <!-- Google -->
            <a href="#" class="registerform-social-btn" aria-label="Google">
                <svg width="22" height="22" viewBox="0 0 48 48">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.73 1.22 9.24 3.6l6.9-6.9C35.9 2.4 30.3 0 24 0 14.6 0 6.4 5.4 2.5 13.3l8 6.2C12.3 13.4 17.7 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.1 24.5c0-1.6-.14-3.1-.4-4.5H24v8.6h12.4c-.54 2.9-2.2 5.3-4.7 7l7.3 5.7c4.3-4 6.8-9.8 6.8-16.8z"/>
                    <path fill="#FBBC05" d="M10.5 28.5c-.5-1.5-.8-3-.8-4.5s.3-3 .8-4.5l-8-6.2C.9 16.5 0 20.1 0 24s.9 7.5 2.5 10.7l8-6.2z"/>
                    <path fill="#34A853" d="M24 48c6.5 0 12-2.1 16-5.8l-7.3-5.7c-2 1.4-4.7 2.3-8.7 2.3-6.3 0-11.7-3.9-13.6-9.3l-8 6.2C6.4 42.6 14.6 48 24 48z"/>
                </svg>
            </a>

            <!-- Facebook -->
            <a href="#" class="registerform-social-btn" aria-label="Facebook">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="#1877F2">
                    <path d="M24 12.07C24 5.4 18.63 0 12 0S0 5.4 0 12.07C0 18.1 4.39 23.09 10.13 24v-8.44H7.08v-3.49h3.05V9.41c0-3.03 1.79-4.7 4.53-4.7 1.31 0 2.68.24 2.68.24v2.97h-1.51c-1.49 0-1.95.93-1.95 1.88v2.26h3.32l-.53 3.49h-2.79V24C19.61 23.09 24 18.1 24 12.07z"/>
                </svg>
            </a>

            <!-- Apple -->
            <a href="#" class="registerform-social-btn" aria-label="Apple">
                <i class="fa-brands fa-apple"></i>
            </a>

        </div>

        <!-- Footer -->
        <div class="registerform-footer">
            <p>
                Already have an account?
                <a href="login.html">Sign In</a>
            </p>
        </div>

    </div>

</section>

<script src="js/script.js"></script>

</body>
</html>
